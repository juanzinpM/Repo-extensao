<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login — Instituto Missão Art</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    form {
      background: #fff;
      padding: 32px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 300px;
    }
    h1 { font-size: 18px; margin-bottom: 20px; text-align: center; }
    .areaLogo { text-align: center; margin-bottom: 20px; }
    .areaLogo img { width: 90px; }
    label { display: block; margin-bottom: 4px; font-size: 14px; }
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 16px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #DB5A61;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <form id="formLogin">
    <div class="areaLogo">
      <img src="/img/logo.png" alt="Instituto Missão Art">
    </div>
    <label for="email">E-mail</label>
    <input type="email" id="email" required>
    <label for="senha">Senha</label>
    <input type="password" id="senha" required>
    <button type="submit">Entrar</button>
  </form>

  <script src="/erros.js"></script>
  <script>
    document.getElementById('formLogin').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      try {
        await chamarApi('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });
        window.location.href = '/';
      } catch (erro) {
        mostrarErro(erro.message);
      }
    });
  </script>
</body>
</html>
